[project]
name = "knowledgepilot-api"
version = "0.1.0"
description = "Private document intelligence and grounded conversations"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn[standard]>=0.41,<1", "pydantic-settings>=2.13,<3", "anyio>=4,<5",
  "sqlalchemy>=2.0.48,<3", "alembic>=1.18,<2", "psycopg[binary]>=3.3,<4",
  "pgvector>=0.4,<1", "redis>=5,<7", "rq>=2.6,<3", "boto3>=1.42,<2",
  "openai>=2.26,<3", "argon2-cffi>=25.1,<26", "python-multipart>=0.0.22,<1",
  "email-validator>=2.3,<3", "pypdf>=6.8,<7", "python-docx>=1.2,<2",
  "tiktoken>=0.12,<1", "structlog>=25.5,<27", "httpx>=0.28,<1"
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.15,<1",
    "mypy>=1.19,<2",
    "boto3-stubs[s3]>=1.42,<2",
    "reportlab>=4.4,<5",
    "fakeredis[lua]>=2.34,<3",
]
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["pytest-cache-files-*", ".test-tmp"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["pgvector.*", "rq.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires disposable PostgreSQL with pgvector and Redis"]
addopts = "-ra"
