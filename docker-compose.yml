name: knowledgepilot
x-api: &api
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://knowledgepilot:${POSTGRES_PASSWORD:-knowledgepilot_local}@postgres:5432/knowledgepilot
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000
    SMTP_HOST: mailpit
  init: true
  restart: unless-stopped
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: knowledgepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledgepilot_local}
      POSTGRES_DB: knowledgepilot
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U knowledgepilot -d knowledgepilot"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-knowledgepilot_local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-knowledgepilot_local_secret}
    volumes: [objects:/data]
    ports: ["127.0.0.1:9001:9001"]
  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-knowledgepilot_local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-knowledgepilot_local_secret}
      S3_BUCKET: ${S3_BUCKET:-knowledgepilot}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        attempts=0
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          attempts=$$((attempts + 1)); [ "$$attempts" -lt 30 ] || exit 1; sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
  migrate:
    <<: *api
    command: [alembic, upgrade, head]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    <<: *api
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10
  worker:
    <<: *api
    command: [python, -m, app.workers.main]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    init: true
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
volumes:
  postgres-data:
  redis-data:
  objects:
