name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: pilot_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: pilot_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U pilot_test -d pilot_test"
          --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://pilot_test:test_only@127.0.0.1:55432/pilot_test
      TEST_DATABASE_URL: postgresql+psycopg://pilot_test:test_only@127.0.0.1:55432/pilot_test
      TEST_REDIS_URL: redis://127.0.0.1:56379/0
      OPENAI_API_KEY: ""
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.11
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
        working-directory: backend
      - run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
          uv run pytest
          uv run python scripts/export_openapi.py --check
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
